name: Deploy CleanTrend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Verify and build current source
        working-directory: source
        run: |
          npm ci
          npm test
          npm run build

      - name: Stage complete static release
        run: |
          mkdir -p "${RUNNER_TEMP}/site"
          rsync -a --exclude='.git' --exclude='.github' --exclude='.publish' --exclude='node_modules' --exclude='.render.mjs' ./ "${RUNNER_TEMP}/site/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
