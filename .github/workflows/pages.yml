name: Deploy CleanTrend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage complete static release
        run: |
          cat .publish/catalog.part.* > source/catalog.json
          cat .publish/app.part.* > assets/app-d0ef2d91c58d.js
          test "$(wc -c < source/catalog.json)" -eq 4729630
          test "$(wc -c < assets/app-d0ef2d91c58d.js)" -eq 4172376
          echo "54d4c8339700d3981dd7b27096f9c22f630f39657c80ed8c9ab4ad19cead1618  source/catalog.json" | sha256sum -c -
          echo "d0ef2d91c58d787ce97c30f3e379350cec17eb23462e0eff52a19e715079bcb2  assets/app-d0ef2d91c58d.js" | sha256sum -c -
          node -e "const c=require('./source/catalog.json'); if(c.length!==1918||new Set(c.map(x=>x.id)).size!==1918) process.exit(1)"
          mkdir -p "${RUNNER_TEMP}/site"
          rsync -a --exclude='.git' --exclude='.github' --exclude='.publish' ./ "${RUNNER_TEMP}/site/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
